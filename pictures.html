<h3> Other Projects </h3>

<details>
  <summary> Links </summary>


The <a href= "https://www.bananaspace.org"> Banana Space </a> is an online mathematics wiki in Chinese, similar to the <a href="https://ncatlab.org"> nLab </a>.  <br>


I was the main editor of the student journal  <a href = "https://sites.google.com/view/aosun/miscellaneous/hesi"> He Si </a> during 2017-2018. <br>

I won the gold medal in the overall part of <a href= "http://yau-contest.com/"> Yau College Student Mathematics Contest </a> in 2017. <br> 

I was a volunteer for <a href="https://cmsa.fas.harvard.edu/strings-2016-conference-at-tsinghua-university-in-beijing/"> Strings 2016 Conference</a> in Beijing. <br>

I believe that computers are able to help humans with proofs, computations and finding mathematical patterns. See also <a href="https://web.math.ucsb.edu/~drm/WHCGP/decade24-final.pdf"> this talk </a> by Michael R. Douglas. <br>

I am interested in increasing accessibility and descreasing language barriers in mathematics. See <a href=https://math.uni.lu/dictionary/> Visual Mathematical Dictionary </a> project.  <br>


I enjoy connections between mathematics and arts. See works of <a href="https://mcescher.com"> Maurits Escher </a> and <a href="https://www.tandfonline.com/journals/tmaa20">  Journal of Mathematics and the Arts </a>. I did some (naive) mathematical paintings. <br>

I am interested in serious recreational mathematics, e.g. logic puzzles and puzzle games. With some people I made a free Chinese translation of the puzzle game <a href = "https://store.steampowered.com/app/1706090/Bean_and_Nothingness/"> Bean and Nothingness </a>, designed by math PHDs from University of Michigan. I also enjoy math jokes, see e.g. <a href= "https://arxiv.org/abs/2403.01010"> My Favorite Math Jokes </a> by Tanya Khovanova. <br>

I enjoy traveling, and thinking about things along the way. I have been to more than 25 countries. <br>

I also enjoy some good movies, e.g. Days of Being Wild. <br>

For me, doing math is a life-long Odyssey (see also <a href="https://link.springer.com/book/10.1007/978-1-4614-8939-9"> A Mathematical Odyssey </a>). One of the most important thing is psychological resilience, no matter what happens outside the Odyssey. Even after a global pandemic, we did not give up on Beauty and Truth. <br>

If you find it hard to believe that there are still new things to do in Mathematics in 2025, check out <a href="https://en.wikipedia.org/wiki/List_of_unsolved_problems_in_mathematics"> List of unsolved problems in mathematics </a> and <a href="https://en.wikipedia.org/wiki/Breakthrough_Prize_in_Mathematics"> Breakthrough Prize in Mathematics </a>. <br>

See also <a href="https://www.ams.org/journals/bull/2025-62-01/?active=current"> Bulletin of the American Mathematical Society </a> e.g. <a href="https://www.ams.org/journals/bull/2024-61-01/S0273-0979-2023-01813-2/S0273-0979-2023-01813-2.pdf"> FROM SPHERE PACKING TO FOURIER INTERPOLATION </a>, and <a href="https://www.ams.org/journals/bull/2024-61-04/S0273-0979-2024-01835-7/S0273-0979-2024-01835-7.pdf"> ALGEBRAIC SOLUTIONS
OF LINEAR DIFFERENTIAL EQUATIONS:
AN ARITHMETIC APPROACH </a>. <br> 

See also <a href="https://www.quantamagazine.org"> Quanta magazine </a>, e.g. <a href="https://www.quantamagazine.org/the-year-in-math-20241216/"> The Year in Math (2024) </a>, <a href="https://www.quantamagazine.org/the-biggest-discoveries-in-math-in-2023-20231222/"> The Year in Math (2023) </a>, <a href="https://www.quantamagazine.org/the-biggest-math-breakthroughs-in-2022-20221222/"> The Year in Math (2022) </a>.
